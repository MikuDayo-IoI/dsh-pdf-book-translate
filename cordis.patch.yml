# dsh-pdf-book-translate 的 bundle patch（双重角色）：
# 1. 声明式补丁：package.json 的 dsh.bundle.patch 指向本文件——插件进入 profile
#    bundle 层后由 loader 自动应用（市场安装/`dsh plugin --profile X add` 的前提）。
# 2. 手动挂载示例：把下面的 insert 行复制到 profile 补丁层
#    （%USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml，桌面实例 patchReload: live 即时生效）。
# 注意：走市场/bundle 层安装时，不要再在 profile 补丁层保留同一条 insert 行，
# 否则 loader 树出现重复 id（pdf-book-translate）导致启动失败（dsh 重复条目保护）。
- insert:
    - id: pdf-book-translate
      name: dsh-pdf-book-translate
      config:
        # API Key 留空时使用当前会话的 Host 模型（无需另外配置密钥）。
        # 也可用 !!js process.env.DEEPSEEK_API_KEY?.trim() || '' 从环境变量读取
        apiKey: ''
        baseUrl: 'https://api.deepseek.com'
        model: 'deepseek-chat'
        hostProvider: ''
        hostModel: ''
        langPair: 'en→zh'
        concurrency: 6
        maxRetries: 3
        timeoutMs: 60000
        termbasePath: ''
        pythonBin: 'python'
